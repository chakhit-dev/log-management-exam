version: '3.8'

services:
  # 1. Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB}
    depends_on:
      - postgres
      - clickhouse
    networks:
      - app-network

  # 2. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

  # 3. pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_web
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD}"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # 3. ClickHouse Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse_db
    restart: always
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    ports:
      - "8123:8123" # HTTP Port
      - "9000:9000" # Native Port
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # - /Users/faraday/Git/GitHub/log-management-exam/backups:/var/lib/clickhouse/user_files/backups
    networks:
      - app-network

  vector:
    image: timberio/vector:latest-debian
    container_name: vector-collector
    restart: always
    ports:
      - "8080:8080"
      - "514:514/udp"
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - ./geoip/dbip-city-lite.mmdb:/etc/vector/dbip-city-lite.mmdb:ro
    command: ["--config", "/etc/vector/vector.toml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - clickhouse
    networks:
      - app-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana_web
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.resend.com:465
      - GF_SMTP_USER=resend
      - GF_SMTP_PASSWORD=${RESEND_API_KEY}
      - GF_SMTP_SKIP_VERIFY=true
      - GF_SMTP_FROM_ADDRESS=myexam@chronotechx.com # โดเมนที่ Verify ใน Resend
      - GF_SMTP_FROM_NAME=Grafana Alert System
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - clickhouse
    networks:
      - app-network

volumes:
  postgres_data:
  clickhouse_data:
  clickhouse_logs:
  pgadmin_data:
  grafana_data:

networks:
  app-network:
    driver: bridge